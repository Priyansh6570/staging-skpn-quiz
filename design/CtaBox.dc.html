<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  @keyframes cta-glow { 0%,100% { opacity: .4; transform: scale(1); } 50% { opacity: .9; transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  @media (max-width: 640px) { [data-e~="ctapad"] { padding-left: 18px !important; padding-right: 18px !important; } }
</style>
</helmet>
<section data-e="ctapad" style="max-width:1220px;margin:0 auto;padding:0 30px 88px;font-family:'Noto Sans Devanagari',system-ui,sans-serif">
  <div style="position:relative;overflow:hidden;border-radius:28px;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center">
    <img src="assets/cosmic-light.png" alt="" width="924" height="540" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 46%" />
    <div style="position:absolute;inset:0;background:radial-gradient(64% 56% at 50% 44%, rgba(7,11,30,.6) 0%, rgba(7,11,30,.9) 62%, rgba(5,8,22,.97) 100%)"></div>
    <div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(38% 30% at 50% 40%, rgba(232,193,115,.22) 0%, rgba(232,193,115,0) 72%);animation:cta-glow 9s ease-in-out infinite"></div>
    <div style="position:relative;padding:74px 30px;display:flex;flex-direction:column;align-items:center;gap:22px">
      <h2 style="margin:0;font-family:'Noto Serif Devanagari',serif;font-weight:600;font-size:clamp(27px,3.9vw,40px);line-height:1.3;color:#FFF9EC;max-width:26ch;text-wrap:balance">{{ heading }}</h2>
      <p style="margin:0;max-width:44ch;font-size:18px;line-height:1.8;color:#EDEAE0">{{ sub }}</p>
      <a href="{{ href }}" style="padding:17px 38px;min-height:58px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#F6E0AC 0%,#E8C173 100%);color:#1E1503;border-radius:999px;font-size:18.5px;font-weight:600;line-height:1.5;text-decoration:none;box-shadow:0 14px 36px rgba(232,193,115,.24);transition:transform .2s ease" style-hover="transform:translateY(-2px)">{{ action }}</a>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hi&quot;,&quot;en&quot;],&quot;default&quot;:&quot;hi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;signedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const T = {
  hi: {
    out: ["प्रतियोगिता में सम्मिलित हों", "पंजीकरण कुछ मिनटों में पूर्ण हो जाता है।", "पंजीकरण करें"],
    pending: ["आपने अभी तक प्रतियोगिता में भाग नहीं लिया है", "अभी प्रारंभ करें।", "प्रतियोगिता में भाग लें"],
    done: ["प्रतियोगिता में भाग लेने के लिए धन्यवाद", "अपना प्रमाण पत्र देखें।", "प्रमाण पत्र देखें"]
  },
  en: {
    out: ["Enter the competition", "Registration takes only a few minutes.", "Register now"],
    pending: ["You have not taken part in the competition yet", "Begin now.", "Take part"],
    done: ["Thank you for taking part in the competition", "View your certificate.", "View certificate"]
  }
};

class Component extends DCLogic {
  state = { signedIn: null, attempts: 0 };

  componentDidMount() {
    try {
      const si = localStorage.getItem("skpn_signed_in") === "1";
      const at = Number(localStorage.getItem("skpn_attempts") || 0);
      if (si || at) this.setState({ signedIn: si, attempts: at });
    } catch (e) {}
  }

  renderVals() {
    const lang = this.props.lang === "en" ? "en" : "hi";
    const signedIn = this.state.signedIn ?? (this.props.signedIn ?? false);
    const attempts = this.state.attempts || 0;
    const key = !signedIn ? "out" : (attempts > 0 ? "done" : "pending");
    const href = !signedIn ? "Register.dc.html" : (attempts > 0 ? "Certificates.dc.html" : "Quiz.dc.html");
    const v = T[lang][key];
    return { heading: v[0], sub: v[1], action: v[2], href: href };
  }
}
</script>
</body>
</html>
