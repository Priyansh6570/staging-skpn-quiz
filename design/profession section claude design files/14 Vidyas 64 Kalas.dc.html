<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: #0a090c; color: #f2eeea; font-family: "Anek Devanagari", system-ui, sans-serif; }
  a { color: #e8b95c; text-decoration: none; }
  a:hover { color: #f6d693; }
  img { display: block; max-width: 100%; }
  ::selection { background: #e8b95c; color: #0a090c; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes rowIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes slowZoom { from { transform: scale(1.06); } to { transform: scale(1.16); } }
  @keyframes orb { 0%,100% { transform: translate3d(0,0,0) scale(1); opacity: .5; } 50% { transform: translate3d(0,-30px,0) scale(1.12); opacity: .8; } }
  @keyframes bob { from { transform: translateY(0); opacity: .9; } to { transform: translateY(10px); opacity: .3; } }
</style>
</helmet>

<div style="background:#0a090c;overflow-x:clip">

  <section style="position:relative;min-height:min(94svh,880px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden">
    <div style="position:absolute;inset:0">
      <img data-hero-img src="uploads/PERFORMANCE%20AND%20ILLUSION.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:34% 42%;animation:slowZoom 30s ease-in-out infinite alternate;will-change:transform"/>
      <div style="position:absolute;inset:0;background:linear-gradient(to top,#0a090c 2%,rgba(10,9,12,.92) 26%,rgba(10,9,12,.35) 58%,rgba(10,9,12,.6) 100%)"></div>
      <div style="position:absolute;left:-15%;bottom:-10%;width:70vw;height:70vw;max-width:760px;max-height:760px;border-radius:50%;background:radial-gradient(circle,rgba(232,185,92,.20),transparent 68%);filter:blur(20px);animation:orb 16s ease-in-out infinite"></div>
    </div>
    <div style="position:relative;padding:0 clamp(20px,6vw,72px) clamp(44px,8vh,88px);width:100%;max-width:1240px">
      <p style="margin:0 0 clamp(14px,2.4vh,20px);font-size:clamp(1rem,4.2vw,1.35rem);font-weight:400;line-height:1.85;color:#e8b95c;animation:fadeUp .9s .06s both">14 विद्याएँ और 64 कलाएँ प्रेरणा बनीं</p>
      <h1 style="margin:0;font-size:clamp(2.4rem,10.5vw,6rem);line-height:1.32;font-weight:600;color:#fffdf9;letter-spacing:0;max-width:20em;animation:fadeUp 1s .16s both">पुरातन और आधुनिक<br/>युग की शक्ति</h1>
    </div>
    <span style="position:absolute;right:clamp(18px,4vw,44px);bottom:clamp(44px,8vh,88px);width:1px;height:56px;background:linear-gradient(#e8b95c,transparent);animation:bob 2.4s ease-in-out infinite alternate"></span>
  </section>

  <div style="border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);padding:clamp(16px,3vh,26px) 0;overflow:hidden;background:#0d0c10">
    <div style="display:flex;width:max-content;animation:marquee 52s linear infinite;will-change:transform">
      <div style="display:flex;gap:clamp(28px,5vw,60px);padding-right:clamp(28px,5vw,60px);align-items:center">
        <sc-for list="{{ vidyaNames }}" as="v" hint-placeholder-count="8"><span style="font-size:clamp(1.05rem,4vw,1.5rem);font-weight:300;line-height:1.7;color:rgba(242,238,234,.34);white-space:nowrap">{{ v }}</span></sc-for>
      </div>
      <div style="display:flex;gap:clamp(28px,5vw,60px);padding-right:clamp(28px,5vw,60px);align-items:center" aria-hidden="true">
        <sc-for list="{{ vidyaNames }}" as="v" hint-placeholder-count="8"><span style="font-size:clamp(1.05rem,4vw,1.5rem);font-weight:300;line-height:1.7;color:rgba(242,238,234,.34);white-space:nowrap">{{ v }}</span></sc-for>
      </div>
    </div>
  </div>

  <section id="suchi" style="position:relative;padding:clamp(46px,8vh,96px) clamp(12px,4vw,72px) clamp(74px,12vh,140px)">
    <div style="position:absolute;top:8%;right:-10%;width:60vw;height:60vw;max-width:640px;max-height:640px;border-radius:50%;background:radial-gradient(circle,rgba(122,104,232,.16),transparent 66%);filter:blur(30px);animation:orb 22s ease-in-out infinite;pointer-events:none"></div>
    <div style="position:relative;max-width:1360px;margin:0 auto">

      <div data-reveal style="margin-bottom:clamp(22px,4vh,38px);padding:0 clamp(6px,2vw,0px)">
        <h2 style="margin:0;font-size:clamp(1.9rem,7.5vw,3.4rem);font-weight:600;line-height:1.4;color:#fffdf9">आधुनिक व्यवसाय</h2>
      </div>

      <div style="position:sticky;top:0;z-index:20;margin:0 calc(-1 * clamp(12px,4vw,72px)) clamp(20px,3.5vh,32px);padding:12px clamp(12px,4vw,72px);background:rgba(10,9,12,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)">
        <div style="display:flex;align-items:center;gap:14px;max-width:1360px;margin:0 auto">
          <div style="display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;padding:2px 0">
            <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
              <button type="button" onClick="{{ c.onClick }}" style="flex:0 0 auto;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};border-radius:999px;padding:9px 18px;font-family:inherit;font-size:.98rem;font-weight:500;line-height:1.6;cursor:pointer;transition:background .25s,color .25s,border-color .25s">{{ c.label }}</button>
            </sc-for>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:{{ gridCols }};gap:clamp(12px,2vw,24px);align-items:start">
        <sc-for list="{{ cards }}" as="p" hint-placeholder-count="6">
          <article data-reveal style="grid-column:{{ p.span }};background:#15141a;border:1px solid {{ p.ring }};border-radius:22px;overflow:hidden;transition:border-color .45s,box-shadow .45s,transform .45s;box-shadow:{{ p.shadow }}">
            <div style="display:grid;grid-template-columns:{{ p.paneCols }}">
              <button type="button" onClick="{{ p.onToggle }}" style="all:unset;display:block;position:relative;width:100%;cursor:pointer;background:#100f14">
                <div style="position:relative;aspect-ratio:{{ p.ratio }};overflow:hidden">
                  <sc-if value="{{ p.img }}" hint-placeholder-val="{{ true }}">
                    <img src="{{ p.img }}" alt="{{ p.alt }}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1);transform:scale({{ p.imgScale }})"/>
                  </sc-if>
                  <sc-if value="{{ p.needsSlot }}">
                    <image-slot id="{{ p.slotId }}" shape="rect" fit="cover" placeholder="चित्र यहाँ जोड़ें" style="position:absolute;inset:0;width:100%;height:100%"></image-slot>
                  </sc-if>
                  <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(10,9,12,.94) 0%,rgba(10,9,12,.4) 40%,transparent 72%)"></div>
                  <span style="position:absolute;top:14px;left:16px;padding:4px 11px;border-radius:999px;background:rgba(10,9,12,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);font-size:.82rem;font-weight:500;color:#e8b95c;line-height:1.6">{{ p.num }}</span>
                  <span style="position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:{{ p.dotBg }};color:{{ p.dotFg }};font-size:1.1rem;line-height:1;transition:background .3s,transform .4s;transform:rotate({{ p.dotRot }})">＋</span>
                  <div style="position:absolute;left:16px;right:16px;bottom:14px;pointer-events:none">
                    <h3 style="margin:0;font-size:clamp(1.3rem,5.4vw,1.9rem);font-weight:600;line-height:1.5;color:#fffdf9">{{ p.hi }}</h3>
                    <span style="display:inline-block;margin-top:6px;font-size:.9rem;font-weight:400;line-height:1.7;color:#d9c9a5">{{ p.count }}</span>
                  </div>
                </div>
              </button>

              <sc-if value="{{ p.open }}">
                <div style="padding:clamp(20px,4.5vw,40px);animation:fadeUp .5s both">
                  <span style="display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(232,185,92,.12);border:1px solid rgba(232,185,92,.3);color:#e8b95c;font-size:.85rem;font-weight:500;line-height:1.7">{{ p.domain }}</span>
                  <p style="margin:14px 0 clamp(18px,3vh,28px);font-size:clamp(1rem,4vw,1.16rem);font-weight:300;line-height:1.95;color:#bfb5a8;max-width:36em">{{ p.blurb }}</p>
                  <div style="display:flex;flex-direction:column;gap:8px">
                    <sc-for list="{{ p.rows }}" as="r" hint-placeholder-count="3">
                      <a href="{{ r.href }}" style="display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);transition:background .3s,border-color .3s,transform .3s;animation:rowIn .5s both;animation-delay:{{ r.delay }}" style-hover="background:rgba(232,185,92,.09);border-color:rgba(232,185,92,.34);transform:translateX(4px)">
                        <span>
                          <span style="display:block;font-size:clamp(1.08rem,4.4vw,1.3rem);font-weight:500;line-height:1.7;color:#fffdf9">{{ r.sk }}</span>
                          <span style="display:block;font-size:clamp(.94rem,3.7vw,1.04rem);font-weight:300;line-height:1.85;color:#a99f92;margin-top:1px">{{ r.gloss }}</span>
                        </span>
                        <span style="display:flex;align-items:center;gap:10px;white-space:nowrap">
                          <span style="font-size:.78rem;font-weight:500;color:#8d8478;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 9px;line-height:1.6">{{ r.kind }}</span>
                          <span style="color:#e8b95c;font-size:1.1rem">→</span>
                        </span>
                      </a>
                    </sc-for>
                  </div>
                </div>
              </sc-if>
            </div>
          </article>
        </sc-for>
      </div>
    </div>
  </section>

</div>
</x-dc>

    ["व्यायामविधि","शरीर-साधना एवं बल-वर्धन","कला"]]],
  ["चित्रकार","कला","रेखा, वर्ण और छाया — देखी हुई दुनिया को गढ़ना।",[
    ["आलेख्य","चित्रांकन एवं वर्ण-योजना","कला"],
    ["रूपकर्म","मूर्ति-रचना एवं प्रतिमा-लक्षण","कला"],
    ["पत्रच्छेद्य","सूक्ष्म कटाई एवं अलंकरण","कला"]]],
  ["लेखा-प्रबंधक","विज्ञान","अंक, तुला और अभिलेख — कोष और व्यवस्था का संचालन।",[
    ["गणित","अंक, क्षेत्र एवं गणना","विद्या"],
    ["अर्थव्यवहार","कोष, वाणिज्य एवं लेखा","कला"],
    ["देशभाषाज्ञान","बहुभाषी व्यवहार एवं संधि","कला"]]],
  ["जल-वैज्ञानिक","विज्ञान","स्रोत, प्रवाह और संचय — भूमि के नीचे बहते जल को पढ़ना।",[
    ["उदकवाद","जल-स्रोत की खोज एवं परीक्षा","कला"],
    ["उदकघात","जल-यंत्र एवं फुहारे","कला"],
    ["वापीकूपविधि","बावड़ी, कूप एवं तालाब निर्माण","कला"]]]
];

const DOMAINS = ["सभी","विज्ञान","शिल्प","कला","जीवन"];

class Component extends DCLogic {
  state = { open: 0, filter: "सभी", wide: true };

  componentDidMount() {
    const mq = matchMedia("(min-width: 860px)");
    this._mq = mq;
    this._onMq = () => this.setState({ wide: mq.matches });
    mq.addEventListener("change", this._onMq);
    this.setState({ wide: mq.matches });

    if (this.props.motion === false) return;
    const els = Array.from(document.querySelectorAll("[data-reveal]"));
    if (!("IntersectionObserver" in window) || !els.length) return;
    const show = el => { el.style.opacity = "1"; el.style.transform = "none"; };
    els.forEach(el => {
      el.style.opacity = "0";
      el.style.transform = "translateY(22px)";
      el.style.transition = "opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1)";
    });
    this._io = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { show(e.target); this._io.unobserve(e.target); } });
    }, { rootMargin: "0px 0px -6% 0px", threshold: 0.01 });
    els.forEach(el => this._io.observe(el));
    this._sweep = setInterval(() => {
      const vh = innerHeight || 800;
      let hidden = 0;
      els.forEach(el => {
        if (el.style.opacity !== "0") return;
        hidden++;
        if (el.getBoundingClientRect().top < vh * 0.94) show(el);
      });
      if (!hidden) clearInterval(this._sweep);
    }, 400);
    this._bail = setTimeout(() => { clearInterval(this._sweep); els.forEach(show); }, 9000);

    const hero = document.querySelector("[data-hero-img]");
    if (hero && mq.matches) {
      let raf = 0;
      this._onScroll = () => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          hero.style.translate = "0 " + (Math.min(scrollY, 900) * 0.16).toFixed(1) + "px";
        });
      };
      addEventListener("scroll", this._onScroll, { passive: true });
    }
  }

  componentWillUnmount() {
    if (this._io) this._io.disconnect();
    clearInterval(this._sweep);
    clearTimeout(this._bail);
    if (this._mq) this._mq.removeEventListener("change", this._onMq);
    if (this._onScroll) removeEventListener("scroll", this._onScroll);
  }

  toggle(i) { this.setState(s => ({ open: s.open === i ? null : i })); }

  renderVals() {
    const filter = this.state.filter;
    const list = P.map((p, i) => ({ p, i })).filter(({ p }) => filter === "सभी" || p[1] === filter);
    const wide = this.state.wide && this.props.layout !== "list";

    const cards = list.map(({ p, i }) => {
      const open = this.state.open === i;
      const vid = p[3].filter(r => r[2] === "विद्या").length;
      const kal = p[3].length - vid;
      return {
        num: DEV(i + 1).padStart(2, "०"),
        hi: p[0], domain: p[1], blurb: p[2], open,
        count: [vid ? DEV(vid) + " विद्या" : null, kal ? DEV(kal) + " कला" : null].filter(Boolean).join(" · "),
        rows: p[3].map((r, ri) => ({
          sk: r[0], gloss: r[1], kind: r[2],
          href: "#vidya-" + (i + 1) + "-" + (ri + 1),
          delay: (0.06 + ri * 0.07).toFixed(2) + "s"
        })),
        img: p[4] || null,
        needsSlot: !p[4],
        slotId: "krishna-" + (i + 1),
        alt: "श्री कृष्ण — " + p[0],
        span: open && wide ? "1 / -1" : "auto",
        paneCols: open && wide ? "minmax(0,1.1fr) minmax(0,1fr)" : "1fr",
        ratio: open && wide ? "4 / 3" : "3 / 2",
        imgScale: open ? "1.04" : "1",
        ring: open ? "rgba(232,185,92,.42)" : "rgba(255,255,255,.08)",
        shadow: open ? "0 40px 90px -50px rgba(232,185,92,.55)" : "0 20px 50px -40px rgba(0,0,0,.9)",
        dotBg: open ? "#e8b95c" : "rgba(10,9,12,.55)",
        dotFg: open ? "#0a090c" : "#f2eeea",
        dotRot: open ? "135deg" : "0deg",
        onToggle: () => this.toggle(i)
      };
    });

    const chips = DOMAINS.map(d => {
      const on = d === filter;
      return {
        label: d,
        bg: on ? "#e8b95c" : "transparent",
        fg: on ? "#0a090c" : "#bfb5a8",
        border: on ? "#e8b95c" : "rgba(255,255,255,.16)",
        onClick: () => this.setState({ filter: d, open: P.findIndex(p => d === "सभी" || p[1] === d) })
      };
    });

    return {
      cards, chips,
      gridCols: wide ? "repeat(auto-fit, minmax(min(100%, 320px), 1fr))" : "1fr",
      vidyaNames: ["स्थापत्यवेद","आयुर्वेद","धातुवाद","ज्योतिष","वृक्षायुर्वेद","व्याकरण","गांधर्ववेद","रत्नपरीक्षा","गंधयुक्ति","नाट्यशास्त्र","न्याय","धनुर्वेद","आलेख्य","उदकवाद","निरुक्त","छंद","मीमांसा","यंत्रमातृका"]
    };
  }
}
</script>
</body>
</html>
